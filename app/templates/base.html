<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Grind{% endblock %} · Grind</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('views.dashboard') }}">Grind</a>
    {% if g.user %}
    <nav>
      <a href="{{ url_for('views.dashboard') }}" {% if request.endpoint and request.endpoint != 'views.results' and (request.blueprint in ('views', 'topics') or request.endpoint == 'practice.exercise') %}class="active"{% endif %}>Topics</a>
      <a href="{{ url_for('practice.notebooks') }}" {% if request.endpoint and 'notebook' in request.endpoint %}class="active"{% endif %}>Scratchpad</a>
      <a href="{{ url_for('views.results') }}" {% if request.endpoint == 'views.results' %}class="active"{% endif %}>My results</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="linkish" type="submit">Log out <span class="muted">({{ g.user.username }})</span></button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Render server UTC timestamps in the viewer's local time.
    document.querySelectorAll('time[data-local]').forEach(function (t) {
      var d = new Date(t.getAttribute('datetime'));
      if (!isNaN(d)) t.textContent = d.toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'});
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
