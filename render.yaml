# Render Blueprint: https://render.com/docs/blueprint-spec
# Data lives in Neon Postgres, so the free instance type works (no persistent disk needed).
# When you apply the Blueprint, Render asks for DATABASE_URL: paste your Neon connection string.
services:
  - type: web
    name: grind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --preload creates the tables once before the workers start.
    startCommand: gunicorn wsgi:app --preload --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
